name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: Stable(标准)
      custom_ref:
        required: false
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

      managerCertSize:
        description: "Manager signing certificate DER size (FinaSU / KernelSU Next)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}

      managerCertSha256:
        description: "Manager signing certificate SHA-256 (FinaSU / KernelSU Next)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSha256 }}

jobs:
  get_ksu_manager:
    if: inputs.kernelsu_variant != 'None'
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      managerCertSize: ${{ steps.manager_cert.outputs.certSize }}
      managerCertSha256: ${{ steps.manager_cert.outputs.certSha }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="
          
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq unzip

      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts

      - name: 确定 KernelSU 分支
        if: inputs.kernelsu_variant != 'None'
        id: ksu-branch
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
          CUSTOM_REF: ${{ inputs.custom_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/resolve-ksu-ref.sh

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "KernelSU Next" ]; then
            echo "This is the KernelSU Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          VAR=$([[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]] && echo 700 || echo 200)

          cd KernelSU
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            # FinaSU kernel/Kbuild: KSU_VERSION = 30000 + git rev-list --count HEAD
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "KernelSU Next" ]; then
            # KernelSU-Next follows the upstream 30000 + commit-count scheme.
            # If upstream changes the offset, adjust here (and the manager versionCode must match).
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          set -euo pipefail

          resolve_ref_to_sha() {
          local repo="$1"
          local ref="$2"
          local sha=""

          # 尝试当作 branch
          sha="$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${repo}/branches/${ref}" \
            | jq -r '.commit.sha // empty')"
          if [ -n "$sha" ]; then
            echo "$sha"
            return
          fi
          echo "::error::无法解析 $ref 为 SHA"
          exit 1
          }

          download_tag_release_apk() {
            local repo="$1"
            local tag="$2"
            local variant="$3"
            local release_json apk_name apk_url
            echo "从 $repo releases/${tag} 获取 $variant Manager APK..."
            release_json="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/tags/${tag}")"
            apk_name="$(echo "$release_json" | jq -r '
              (.assets | map(select(((.name | ascii_downcase) | endswith(".apk")) and ((.name | ascii_downcase) | contains("release")))) | .[0].name // empty) as $release_apk |
              if $release_apk != "" then $release_apk
              else (.assets | map(select((.name | ascii_downcase) | endswith(".apk"))) | .[0].name // empty)
              end
            ')"
            apk_url="$(echo "$release_json" | jq -r --arg name "$apk_name" '.assets[] | select(.name == $name) | .browser_download_url')"
            if [ -z "$apk_name" ] || [ -z "$apk_url" ]; then
              echo "::error::${repo} ${tag} release 中未找到 APK 资源"
              echo "$release_json" | jq -r '.assets[]?.name'
              exit 1
            fi
            mkdir -p "manager-artifacts/${variant}"
            echo "下载 $apk_name"
            curl -fL -o "manager-artifacts/${variant}/${apk_name}" "$apk_url"
            }

          download_manager_for_repo() {
          local repo="$1"
          local variant="$2"
          local sha="$BRANCH"
          if ! [[ "$sha" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            sha="$(resolve_ref_to_sha "$repo" "$sha")"
            BRANCH="$sha"
          fi
          echo "→ Download manager for ${repo} at head_sha=${sha}"
          GITHUB_REPOSITORY="${{ github.repository }}" \
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash .github/scripts/download-manager-from-actions.sh \
              "$repo" "$sha" "manager-artifacts/${variant}"
          }

          case "${{ inputs.kernelsu_variant }}" in
            "Official")
              if [[ "$BRANCH" =~ ^[Vv]?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                download_tag_release_apk "tiann/KernelSU" "$BRANCH" "Official"
              else
                download_manager_for_repo "tiann/KernelSU" "Official"
              fi
              ;;
            "SukiSU")
              if [[ "$BRANCH" =~ ^[Vv]?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                download_tag_release_apk "SukiSU-Ultra/SukiSU-Ultra" "$BRANCH" "SukiSU"
              else
                download_manager_for_repo "SukiSU-Ultra/SukiSU-Ultra" "SukiSU"
              fi
              ;;
            "BakaSU")
              # BakaSU has no release APKs; Actions build-manager (fallback to main latest in script).
              download_manager_for_repo "Baka-SU/BakaSU" "BakaSU"
              ;;
            "FinaSU")
              if [[ "$BRANCH" =~ ^[Vv]?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                download_tag_release_apk "LyraVoid/FinaSU" "$BRANCH" "FinaSU"
              else
                download_manager_for_repo "LyraVoid/FinaSU" "FinaSU"
              fi
              ;;
            "KernelSU Next")
              # variant dir must stay space-free: manager-artifacts/${variant}
              if [[ "$BRANCH" =~ ^[Vv]?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                download_tag_release_apk "KernelSU-Next/KernelSU-Next" "$BRANCH" "KernelSUNext"
              else
                download_manager_for_repo "KernelSU-Next/KernelSU-Next" "KernelSUNext"
              fi
              ;;
            *)
              echo "::error::未知 KernelSU 变体: ${{ inputs.kernelsu_variant }}"
              exit 1
              ;;
          esac

          if ! find manager-artifacts -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::未下载到任何 Manager APK"
            find manager-artifacts -maxdepth 3 -type f -print || true
            exit 1
          fi

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
          jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url') 

          NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "SUSFS_NAME=$NAME" >> $GITHUB_ENV
          NAME="susfs-$NAME.zip"
          
          echo $DOWNLOAD_URL
          echo $NAME
          # 下载 Manager 文件
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$NAME" "$DOWNLOAD_URL"
          echo "$NAME 文件已下载.zip"
          
          
          # 解压 artifact zip 获取里面的模块文件
          mkdir -p susfs-module
          unzip "$NAME" -d susfs-temp

          # 检查解压后的内容：如果是散装文件则打包成 zip
          cd susfs-temp
          if ls *.zip 1>/dev/null 2>&1; then
            # 里面已经是 zip 文件，直接移动
            mv *.zip ../susfs-module/
          else
            # 是散装文件，打包成 zip
            zip -r "../susfs-module/ksu_module_susfs.zip" .
          fi
          cd ..
          rm -rf susfs-temp "$NAME"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: |
            **/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
      
      - name: 提取管理器签名证书 (FinaSU / KernelSU Next)
        id: manager_cert
        if: inputs.kernelsu_variant == 'FinaSU' || inputs.kernelsu_variant == 'KernelSU Next'
        run: |
          set -euo pipefail
          apk="$(find manager-artifacts -type f -name '*.apk' | head -n1)"
          [ -n "$apk" ] || { echo "::error::未找到管理器 APK"; exit 1; }
          # FinaSU / KernelSU-Next 的 manager 只有 v2/v3 签名(无 v1 JAR 签名),
          # 直接解析 APK Signing Block 取第一张证书 DER。
          python3 - "$apk" <<'PYEOF'
          import struct, sys, hashlib
          apk = sys.argv[1]
          d = open(apk, 'rb').read()
          magic = b'APK Sig Block 42'
          pos = d.rfind(magic)
          if pos < 0:
              sys.exit('no APK Signing Block (v2/v3)')
          size2 = struct.unpack('<Q', d[pos-8:pos])[0]
          block_start = pos + 16 - size2 - 8
          size1 = struct.unpack('<Q', d[block_start:block_start+8])[0]
          pairs = d[block_start+8:block_start+size1-8]
          def rd(buf, off):
              n = struct.unpack('<I', buf[off:off+4])[0]
              return buf[off+4:off+4+n], off+4+n
          found = None
          i = 0
          while i + 12 <= len(pairs):
              ln = struct.unpack('<Q', pairs[i:i+8])[0]
              pid = struct.unpack('<I', pairs[i+8:i+12])[0]
              val = pairs[i+12:i+8+ln]
              if pid in (0x7109871a, 0xf05368c0, 0x1b93ad61):
                  found = val
                  break
              i += 8 + ln
          if not found:
              sys.exit('no v2/v3 signer block')
          signers, _ = rd(found, 0)
          signer, _ = rd(signers, 0)
          signed_data, _ = rd(signer, 0)
          _digests, off = rd(signed_data, 0)
          certs, _ = rd(signed_data, off)
          cert, _ = rd(certs, 0)
          print(len(cert), hashlib.sha256(cert).hexdigest())
          PYEOF
          read -r size sha < <(python3 - "$apk" <<'PYEOF'
          import struct, sys, hashlib
          apk = sys.argv[1]
          d = open(apk, 'rb').read()
          pos = d.rfind(b'APK Sig Block 42')
          size2 = struct.unpack('<Q', d[pos-8:pos])[0]
          bs = pos + 16 - size2 - 8
          size1 = struct.unpack('<Q', d[bs:bs+8])[0]
          pairs = d[bs+8:bs+size1-8]
          def rd(buf, off):
              n = struct.unpack('<I', buf[off:off+4])[0]
              return buf[off+4:off+4+n], off+4+n
          found = None
          i = 0
          while i + 12 <= len(pairs):
              ln = struct.unpack('<Q', pairs[i:i+8])[0]
              pid = struct.unpack('<I', pairs[i+8:i+12])[0]
              if pid in (0x7109871a, 0xf05368c0, 0x1b93ad61):
                  found = pairs[i+12:i+8+ln]
                  break
              i += 8 + ln
          if not found:
              sys.exit('no v2/v3 signer block')
          signers, _ = rd(found, 0)
          signer, _ = rd(signers, 0)
          sd, _ = rd(signer, 0)
          _dg, off2 = rd(sd, 0)
          certs, _ = rd(sd, off2)
          cert, _ = rd(certs, 0)
          print(len(cert), hashlib.sha256(cert).hexdigest())
          PYEOF
          )
          [ -n "${size:-}" ] || { echo "::error::证书提取失败"; exit 1; }
          echo "管理器签名证书: size=$size sha256=$sha"
          echo "certSize=$size" >> "$GITHUB_OUTPUT"
          echo "certSha=$sha" >> "$GITHUB_OUTPUT"
